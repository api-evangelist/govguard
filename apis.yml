aid: govguard
name: GovGuard
description: >-
  GovGuard is a Y Combinator-backed (Spring 2026) GovTech company building AI
  infrastructure for government agencies, starting with Freedom of Information
  Act (FOIA) request automation. Its AI agents route incoming public-records
  requests, search across municipal archives (emails, meeting minutes, PDFs, and
  shared drives), flag personally identifiable information and other exempt
  material for redaction against the relevant state exemption codes, and draft
  response letters for clerk review while maintaining a complete audit trail.
  Agencies retain full ownership and control of all records and metadata, and
  GovGuard states that it does not train models on client data. The company was
  founded by Aditya Sabharwal and Gleb Hulting and is based in San Francisco.
